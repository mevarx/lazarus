# The check is a heuristic pre-attack signal, not proof of compromise.
name: lazarus
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      warn_only:
        description: Warn instead of failing on CRITICAL findings
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  domain-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check maintainer email domains for takeover risk
        env:
          LAZARUS_WARN_ONLY: ${{ github.event.inputs.warn_only || 'false' }}
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            manifest=package-lock.json
          elif [[ -f package.json ]]; then
            manifest=package.json
          else
            # This repo is pure Python with no JS manifest; the dependency
            # check only applies to repos that vendor a lockfile. Skip it
            # rather than failing — the unit tests above are the gate.
            echo "::notice::No package-lock.json or package.json in this repo; skipping dependency check."
            exit 0
          fi

          set +e
          "${PYTHON:-python}" lazarus.py check "$manifest" --json > lazarus-report.json
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "No CRITICAL findings."
          elif [[ "$status" -eq 1 && "$LAZARUS_WARN_ONLY" == "true" ]]; then
            echo "::warning::Lazarus found CRITICAL risk signals; review before merging."
          elif [[ "$status" -eq 1 ]]; then
            echo "::error::Lazarus found CRITICAL risk signals."
            exit 1
          elif [[ "$status" -eq 2 ]]; then
            echo "::error::Lazarus could not read or parse the dependency file."
            exit 2
          else
            echo "::error::Lazarus exited unexpectedly with status $status."
            exit "$status"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazarus-report
          path: lazarus-report.json
          if-no-files-found: ignore
