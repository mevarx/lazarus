# Example GitHub Action: fail CI when a dependency's maintainer email domain
# is at CRITICAL takeover risk.
#
# This runs `lazarus check` against your lockfile. It exits 1 on any CRITICAL
# finding, failing the job. It is a heuristic pre-attack signal, not proof of
# compromise — treat a failure as "investigate", and allow manual override.
#
# Setup: commit your package-lock.json (or package.json), drop this file at
# .github/workflows/lazarus.yml, and push. No secrets required for the public
# npm + RDAP lookups. If you later add a GEMINI_API_KEY secret, narration
# upgrades automatically — it is never required for the check to run.

name: lazarus
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC — domains lapse over time

permissions:
  contents: read

jobs:
  domain-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check maintainer email domains for takeover risk
        # Exits 1 on CRITICAL findings. Set continue-on-error to warn-only.
        run: |
          python lazarus.py check package-lock.json \
            || python lazarus.py check package.json \
            || echo "::warning::Lazarus found CRITICAL domain-takeover risk signals — review before merging."

      # Optional: machine-readable output for downstream jobs / artifacts
      - name: Emit JSON report
        if: always()
        run: python lazarus.py check package-lock.json --json > lazarus-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazarus-report
          path: lazarus-report.json
          if-no-files-found: ignore
